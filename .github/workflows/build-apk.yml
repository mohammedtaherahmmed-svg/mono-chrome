name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Optional production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mono-chrome-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mono-chrome-release.jks" >> "$GITHUB_ENV"
          else
            echo "Signing with the debug key."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$SRC"
          cp "$SRC" dist/Daftar.apk
          ls -lh dist/Daftar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonoChrome-APK
          path: dist/Daftar.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: دفتر الصندوق — APK
          body: |
            ثبّت **Daftar.apk**. التطبيق يفتح مباشرة بدون أي رابط.

            1. امسح أي نسخة قديمة اسمها Mono Chrome.
            2. نزّل Daftar.apk وثبّته.
            3. الأيقونة اسمها **دفتر الصندوق**.
          files: dist/Daftar.apk
          make_latest: true
