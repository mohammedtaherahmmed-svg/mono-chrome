name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "رابط التطبيق المنشور (HTTPS) — اختياري"
        required: false
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_APP_URL: ${{ github.event.inputs.web_app_url || vars.WEB_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$SRC" dist/MonoChrome.apk
          ls -lh dist/MonoChrome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonoChrome-APK
          path: dist/MonoChrome.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mono Chrome — APK
          body: |
            حمّل **MonoChrome.apk** وثبّته على الأندرويد.

            1. نزّل الملف من المرفقات تحت.
            2. على الموبايل: اسمح بالتثبيت من مصدر غير معروف إن طُلب.
            3. افتح **Mono Chrome**.

            البيانات مشتركة بين الموظفين على السيرفر (مش نسخة محلية).
            لو ظهر شاشة الرابط، الصق رابط التطبيق المنشور ثم ادخل.
          files: dist/MonoChrome.apk
          make_latest: true
