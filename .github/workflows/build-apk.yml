name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "رابط التطبيق المنشور (HTTPS) — اختياري"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_APP_URL: ${{ github.event.inputs.web_app_url || vars.WEB_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$SRC"
          cp "$SRC" dist/MonoChrome.apk
          ls -lh dist/MonoChrome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonoChrome-APK
          path: dist/MonoChrome.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mono Chrome — APK
          body: |
            حمّل **MonoChrome.apk** وثبّته على الأندرويد.

            1. نزّل الملف من المرفقات تحت.
            2. على الموبايل: اسمح بالتثبيت من مصدر غير معروف إن طُلب.
            3. افتح **Mono Chrome**.

            البيانات مشتركة بين الموظفين على السيرفر (مش نسخة محلية).
            لو ظهر شاشة الرابط، الصق رابط التطبيق المنشور ثم ادخل.
          files: dist/MonoChrome.apk
          make_latest: true
