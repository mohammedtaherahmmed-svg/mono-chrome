plugins {
    id 'com.android.application'
}

def webUrl = (System.getenv("WEB_APP_URL") ?: "").trim()
if (webUrl && !webUrl.startsWith("https://")) {
    throw new GradleException("WEB_APP_URL must use HTTPS")
}
def webHost = webUrl ? new URI(webUrl).host : ""
def escaped = webUrl.replace("\\", "\\\\").replace("\"", "\\\"")
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystore && System.getenv("ANDROID_KEYSTORE_PASSWORD") && System.getenv("ANDROID_KEY_ALIAS") && System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.monochrome.ledger'
    compileSdk 35

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.monochrome.ledger"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
        resValue "string", "web_app_url", webUrl
        buildConfigField "String", "WEB_APP_URL", "\"${escaped}\""
        buildConfigField "String", "WEB_APP_HOST", "\"${webHost ?: ""}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
